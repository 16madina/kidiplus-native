plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kidiplus.liveeffects'
version = '1.0.0'

android {
  namespace "com.kidiplus.liveeffects"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "androidx.camera:camera-core:1.3.4"
  implementation "androidx.camera:camera-camera2:1.3.4"
  implementation "androidx.camera:camera-lifecycle:1.3.4"
  implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
  // Publish the ML Kit-composited frames directly. Sharing LiveKit's exact
  // version with Camera Kit avoids two incompatible WebRTC runtimes in the
  // same application.
  implementation "io.livekit:livekit-android:2.28.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
