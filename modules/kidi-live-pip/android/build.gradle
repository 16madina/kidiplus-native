plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kidiplus.livepip'
version = '1.0.0'

android {
  namespace "com.kidiplus.livepip"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = "1.8"
  }
}
